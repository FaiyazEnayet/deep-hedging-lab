[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-hedging-lab"
version = "0.1.0"
description = "Deep hedging of derivatives with neural networks: train hedging agents under transaction costs and stochastic volatility, benchmarked against Black-Scholes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Faiyaz Enayet" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter", "nbformat"]

[project.urls]
Homepage = "https://github.com/FaiyazEnayet/deep-hedging-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
